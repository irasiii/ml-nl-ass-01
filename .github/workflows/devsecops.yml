name: DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 20 * * 0"     # weekly re-scan (Monday 6 am Brisbane)

# Least privilege: the pipeline can only read the repository.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # scan the full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-and-security:
    name: Lint, SAST and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Static security analysis (bandit)
        run: bandit -c pyproject.toml -r . -f txt
      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements-dev.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [secrets, quality-and-security]
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q

  build:
    name: Build outputs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python q1_parsing.py > /dev/null
          python q2_tfidf.py > /dev/null
          python q3_bm25.py > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: outputs/*.txt
